# Next.js UI only — terminate TLS and reverse-proxy on the HOST nginx (ports 80/443).
#
#   docker compose up --build -d
#
# UI (localhost): http://127.0.0.1:3002  →  configure host nginx from deploy/nginx/host/

name: techfind-ui

services:
  ui:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${UI_PORT:-3002}:${UI_PORT:-3002}'
    environment:
      NODE_ENV: production
      PORT: ${UI_PORT:-3002}
      HOSTNAME: 0.0.0.0
      API_URL: ${API_URL:-https://bot.techfindconsulting.africa}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3002)+'/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
