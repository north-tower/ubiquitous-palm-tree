# HTTP — ACME webroot + redirect to HTTPS (app served on 443 in whatsappdesk.ssl.conf).

server {
    listen 80;
    listen [::]:80;
    server_name whatsappdesk.techfindconsulting.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
