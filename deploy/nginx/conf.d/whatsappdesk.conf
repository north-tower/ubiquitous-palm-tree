# HTTP — ACME webroot + app proxy. After TLS is issued, enable
# whatsappdesk.ssl.conf (from whatsappdesk.ssl.conf.example) and switch the
# location / block below to return 301 https://$host$request_uri;

server {
    listen 80;
    listen [::]:80;
    server_name whatsappdesk.techfindconsulting.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://ui:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
